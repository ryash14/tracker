const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const PR2=[[10,10],[17,18],[22,26],[30,33],[34,34],[37,47],[48,55]];
const PB={10:["ML Prediction API","Learning project, day 10"],17:["PyTorch Image Classifier","Learning project, days 17-18"],22:["Mini Transformer (GPT from scratch)","Learning project, days 22-26"],30:["Semantic Search + RAG Eval Harness","Learning project, days 30-33"],34:["Tool-Using Agent","Learning project, day 34"],37:["Capstone 1: AWS Recovery Intelligence System","Portfolio project, days 37-47"],48:["Capstone 2: Agent Evaluation Lab","Portfolio project, days 48-55"]};
const CH={wk:["Learn 1h","Build 1h+","DSA + say aloud 30m"],sat:["Learn + build 3h","Build + DSA 2h"],sun:["Revision 3h","Then off"]};
function kind(n){if(REV.includes(n)&&n<56)return["buffer","Revision"];if(n>=56)return["mock","Interview"];if(PR2.some(r=>n>=r[0]&&n<=r[1]))return["mock","Project"];return["study","Study"]}
const f=(k,v,m)=>`<div class="field"><span class="k">${k}</span><span class="v${m?" muted":""}">${v}</span></div>`;
const ci=(k,t)=>`<label class="chk-item"><input type="checkbox" data-k="${k}" ${S[k]?"checked":""}>${t}</label>`;
function card(d){const n=d.n,ty=kind(n),rev=REV.includes(n);
const ds=d.ds.length?d.ds.map(i=>ci("s"+i,`${DS[i].n} <small>${DS[i].d} · ${DS[i].p}</small>`)).join(""):(rev?"Redo 3 problems from your mistake notes":"None, project focus");
return`<div class="day-card" id="d${n}">
<div class="day-top"><div class="day-top-l"><span class="day-num">Day ${n}</span><span class="subj">${d.t.replace(/ \[.*?\]/,"")}</span></div><span class="badge ${ty[0]}">${ty[1]}</span></div>
${f("Learn",d.res)}${f("Must",d.must)}<div class="opt">${f("Should",d.should,1)}${f("Bonus",d.bonus,1)}</div>${f("DSA",ds,!d.ds.length)}${f("Aloud",d.iq,1)}${rev&&CP[n]?f("Check",CP[n]):""}${f("Output",d.del,1)}
<div class="budget-row">${CH[typ(n)].map(c=>`<span class="chip">${c}</span>`).join("")}</div>
<div class="checks">${ci("d"+n+"m","Must done")}<span class="opt" style="display:contents">${ci("d"+n+"s","Should done")}${ci("d"+n+"b","Bonus done")}</span>${rev&&CP[n]?ci("d"+n+"c","Checkpoint passed"):""}</div>
<textarea class="notes" data-k="dl${n}" placeholder="Log — what I did, what broke, what I fixed...">${esc(S["dl"+n])}</textarea></div>`}
function build(){let h="";const cw=wk(cur());
for(let w=1;w<=9;w++){const a=D.filter(d=>wk(d.n)==w);
h+=`<details class="week" ${w==cw?"open":""}><summary class="week-head"><span>Week ${w}</span><span class="wk-progress" data-w="${w}"></span></summary><div class="day-list"><div class="goal">${WG[w-1]}</div>`+
a.map(d=>{const p=PB[d.n];return(p?`<div class="proj"><div><b>${p[0]}</b><small>${p[1]}</small></div>${ci("pj"+d.n,"Shipped")}</div>`:"")+card(d)}).join("")+"</div></details>"}
const g={},o=[];const dy={};D.forEach(d=>d.ds.forEach(i=>dy[i]=d.n));DS.forEach(d=>{(g[d.p]=g[d.p]||(o.push(d.p),[])).push(d)});
h+=`<details class="week"><summary class="week-head"><span>DSA sheet</span><span class="wk-progress" id="dp"></span></summary><div class="day-list">`+o.map(p=>`<div class="pat">${p}</div>`+g[p].map(d=>`<div class="srow"><input type="checkbox" data-k="s${d.id}" ${S["s"+d.id]?"checked":""}><span>${d.n}</span><span class="lv-${d.d[0]}">${d.d}</span><span style="color:var(--text-3)">${dy[d.id]?"D"+dy[d.id]:""}</span></div>`).join("")).join("")+"</div></details>";
$("#weeks").innerHTML=h;refresh()}
function refresh(){let d=0,p=0,pj=0,s=0;for(let i=1;i<=60;i++){const on=dm(i);if(on)d++;const c=$("#d"+i);if(c){c.classList.toggle("complete",!!on);c.classList.toggle("today",i==cur())}}
DS.forEach(x=>{if(S["s"+x.id])p++});Object.keys(PB).forEach(k=>{if(S["pj"+k])pj++});for(let i=cur()-1;i>=1&&dm(i);i--)s++;
$("#stats").innerHTML=[[d+"/60","Days done"],[p+"/"+DS.length,"Problems"],[pj+"/7","Projects"],[s,"Day streak"]].map(x=>`<div class="stat"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("");
$("#pf").style.width=d*100/60+"%";$("#pl").textContent=d+" / 60";$("#dp").textContent=p+" / "+DS.length;
document.querySelectorAll("[data-w]").forEach(e=>{const w=+e.dataset.w;let c=0,t=0;for(let i=(w-1)*7+1;i<=Math.min(60,w*7);i++){t++;if(dm(i))c++}e.textContent=c+" / "+t+" days"})}
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.k;if(t.id=="fi"){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);sv();build()}catch(x){alert("Invalid file")}};r.readAsText(t.files[0]);return}
if(k&&t.type=="checkbox"){S[k]=t.checked;sv();document.querySelectorAll(`input[data-k="${k}"]`).forEach(c=>c.checked=t.checked);refresh()}});
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.k;if(k&&t.type!="checkbox"){S[k]=t.value;sv()}});
function setLow(v){S.low=v;document.body.classList.toggle("low",v);$("#low").classList.toggle("on",v);$("#low").textContent=v?"Low energy: on":"Low energy"}
$("#low").onclick=()=>{setLow(!S.low);sv()};
$("#th").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark";try{localStorage.setItem("p60theme",r.dataset.theme)}catch(e){}};
$("#rs").onclick=()=>{if(confirm("Reset all progress and notes? This cannot be undone.")){S={};sv();build();setLow(false)}};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="tracker-backup.json";a.click()};
$("#im").onclick=()=>$("#fi").click();
try{const th=localStorage.getItem("p60theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
build();setLow(!!S.low);setTimeout(()=>{const c=$("#d"+cur());if(c&&cur()>1)c.scrollIntoView({block:"start"})},60);
</script></body></html>
